# M0 dev environment (plan §13.1.1). Bring up the backing services, then run:
#   npm run db:up        # start Postgres + Redis
#   npm start            # hub without DB (in-memory)
#   npm run demo:db      # or: end-to-end demo against Postgres
#
# PostgreSQL:        postgres://hub:hub@localhost:5434/hub
# DATABASE_URL env:  DATABASE_URL=postgres://hub:hub@localhost:5434/hub
#
# Redis is provisioned now for the M0 queue/retry/DLQ workstream (plan §13.1.5);
# nothing connects to it yet.
#
# Host ports 5434/6380 are used (not 5432/6379) so this env coexists with other
# local projects that already bind the default ports.

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: hub
      POSTGRES_PASSWORD: hub
      POSTGRES_DB: hub
    ports:
      - "5434:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hub -d hub"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      # Host 6380: some dev machines already run a local Redis on 6379.
      - "6380:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  # The hub itself, containerized (the facility installer unit — plan §4.2
  # "Ships as Docker compose"; Dockerfile at repo root). The image tag is the
  # release the signed-update machinery swaps. Run: npm run up:stack
  hub:
    build:
      context: .
    image: medconnect-hub:0.1.0
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://hub:hub@db:5432/hub
      HOST: 0.0.0.0
      HUB_ADMIN_KEY: ihk_docker_demo_001
    ports:
      - "3000:3000"
      # Device port: macOS AirPlay owns the wildcard 5000, so map to host 5001.
      - "5001:5000"

  # Imaging (workstream M3): Orthanc is the DICOM engine — an ADJACENT, SEPARATE
  # process (AGPLv3) the hub drives over its REST API; never embedded or linked
  # (plan §3.2 decision matrix, §7.5.5 boundary). The hub's @integration-hub/dicom
  # adapter talks REST only — no Node DICOM stack. REST: http://127.0.0.1:8042
  orthanc:
    image: jodogne/orthanc:latest
    ports:
      - "8042:8042"  # Orthanc REST API + Explorer
      - "4242:4242"  # DICOM C-STORE/C-FIND port (modalities arrive here)
    volumes:
      - orthancdata:/var/lib/orthanc/db

volumes:
  pgdata:
  orthancdata: